<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>القبول والتسجيل - كلية الآداب</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="topbar">
        <a href="login.html" class="login-btn">تسجيل الدخول</a>
    </div>
    <header class="main-header">
        <div class="container nav-flex">
            <div class="logo">
                <img src="images/logo.png" alt="شعار كلية الآداب" />
            </div>
            <nav>
                <ul class="main-nav">
                    <li><a class="active" href="index.html">الرئيسية</a></li>
                    <li><a href="about.html">عن الكلية</a></li>
                    <li><a href="departments.html">الأقسام العلمية</a></li>
                    <li><a href="students.html">شؤون الطلاب</a></li>
                    <li><a href="postgraduates.html">الدراسات العليا</a></li>
                    <li><a href="community.html">خدمة المجتمع</a></li>
                    <li><a href="news.html">الأخبار</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                </ul>
            </nav>
            <div class="faculty-name">
                <span>كلية الآداب<br><span class="subtext">جامعة القاهرة</span></span>
            </div>
        </div>
    </header>
    <section class="page-hero">
        <h2 class="fade-in">القبول والتسجيل</h2>
        <p class="fade-in" style="animation-delay:.13s">نموذج تسجيل مبدئي</p>
    </section>
    <main class="main-content">
        <form id="admission-form" class="fade-in admission-form">
            <label>الاسم بالكامل: <input type="text" name="name" required></label>
            <label>البريد الإلكتروني: <input type="email" name="email" required></label>
            <label>البرنامج:
                <select name="program" required>
                    <option value="">اختر البرنامج</option>
                    <option value="بكالوريوس">بكالوريوس</option>
                    <option value="دبلوم">دبلوم</option>
                    <option value="ماجستير">ماجستير</option>
                    <option value="دكتوراه">دكتوراه</option>
                </select>
            </label>
            <button class="cta-btn" type="submit">إرسال</button>
        </form>
        <div id="admission-msg"></div>
    </main>
    <footer> ... </footer>
    <script>
        document.getElementById('admission-form').onsubmit = function (e) {
            e.preventDefault();
            let valid = true, msg = '';
            this.querySelectorAll('input,select').forEach(inp => {
                if (!inp.value) valid = false;
            });
            msg = valid ? "تم إرسال البيانات بنجاح! سنتواصل معك قريباً." : "يرجى استكمال جميع الحقول.";
            document.getElementById('admission-msg').textContent = msg;
            document.getElementById('admission-msg').style.color = valid ? "#004aad" : "#c00";
        }
    </script>
</body>

</html>
