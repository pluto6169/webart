        </div>
    </main>
    <footer> ... </footer>
    <script>
        // عدادات متحركة
        function animateCount(id, to, duration) {
            let el = document.getElementById(id), start = 0, startTime = null;
            function animate(ts) {
                if (!startTime) startTime = ts;
                let progress = Math.min((ts - startTime) / duration, 1);
                el.textContent = Math.floor(progress * (to - start) + start);
                if (progress < 1) requestAnimationFrame(animate);
                else el.textContent = to;
            }
            requestAnimationFrame(animate);
        }
        window.addEventListener('DOMContentLoaded', () => {
            animateCount('s1', 18, 800);
            animateCount('s2', 6500, 1200);
            animateCount('s3', 34, 900);
            animateCount('s4', 127, 1000);
        });
    </script>
